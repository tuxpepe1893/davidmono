name: Test cask

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: ruby -c Casks/david-mono.rb
      - run: python scripts/validate_cask.py
      - name: Prepare official Homebrew cask
        run: |
          python scripts/prepare_homebrew_cask.py "$RUNNER_TEMP/font-david-mono.rb"
          ruby -c "$RUNNER_TEMP/font-david-mono.rb"
          python scripts/validate_cask.py "$RUNNER_TEMP/font-david-mono.rb"
      - uses: actions/upload-artifact@v4
        with:
          name: homebrew-submission-cask
          path: ${{ runner.temp }}/font-david-mono.rb
