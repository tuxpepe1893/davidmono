name: Build fonts

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/build_david_mono.py
      - run: python scripts/validate_david_mono.py
      - uses: actions/upload-artifact@v4
        with:
          name: david-mono-fonts
          path: fonts/david-mono
